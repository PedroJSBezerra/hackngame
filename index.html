<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Minecraft 3D - Terceira Pessoa</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #7ec0ee;
            font-family: monospace;
            touch-action: none;
            position: fixed;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
        }
        #play-btn {
            padding: 16px 50px;
            font-size: 22px;
            font-weight: bold;
            font-family: monospace;
            background: #55FF55;
            color: #111;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(85,255,85,0.4);
        }
        #play-btn:active {
            background: #3cb371;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
            display: none;
            z-index: 10;
            pointer-events: none;
        }
        #selector-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            display: none;
            gap: 8px;
            z-index: 10;
        }
        .block-opt {
            width: 40px;
            height: 40px;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
        }
        #opt-grass { background: #559933; }
        #opt-dirt { background: #8b5a2b; }
        #opt-stone { background: #7f7f7f; }
        .block-opt.selected { border-color: #55FF55; transform: scale(1.1); }

        #controls-hud {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 10;
            pointer-events: none;
            display: none;
        }
        .joystick-base {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
        }
        .joystick-knob {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
            pointer-events: none;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
            align-items: flex-end;
        }
        .action-row {
            display: flex;
            gap: 12px;
        }
        .action-btn {
            width: 60px;
            height: 60px;
            background: rgba(30, 30, 40, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .action-btn:active {
            background: rgba(85, 255, 85, 0.5);
        }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1 style="color: #55FF55; margin-bottom: 5px; font-size: 28px;">MINECRAFT 3D</h1>
        <p style="color: #aaa; margin-bottom: 30px; font-size: 12px;">Modo Terceira Pessoa + Física</p>
        <button id="play-btn" onclick="startGame()">JOGAR</button>
    </div>

    <div id="hud">Pos: <span id="pos-val">0, 0, 0</span></div>
    
    <div id="selector-hud">
        <div class="block-opt selected" id="opt-grass" onclick="selectBlockType(0)"></div>
        <div class="block-opt" id="opt-dirt" onclick="selectBlockType(1)"></div>
        <div class="block-opt" id="opt-stone" onclick="selectBlockType(2)"></div>
    </div>

    <div id="controls-hud">
        <div class="joystick-base" id="joystick">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div class="action-row">
                <div class="action-btn" id="btn-jump" onclick="jumpPlayer()" style="background: rgba(0,150,255,0.4);">PULAR</div>
            </div>
            <div class="action-row">
                <div class="action-btn" id="btn-break" onclick="breakBlock()">QUEBRAR</div>
                <div class="action-btn" id="btn-place" onclick="placeBlock()" style="background: rgba(85,255,85,0.35);">COLOCAR</div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let blocks = [];
        let gameStarted = false;
        let playerMesh, playerBox;
        
        let player = {
            x: 0, y: 10, z: 0,
            vy: 0, // Velocidade vertical (gravidade)
            speed: 0.12,
            rotY: 0,
            isGrounded: false
        };

        let cameraAngleX = 0.5; // Inclinação da câmera
        let cameraAngleY = 0;   // Rotação orbital ao redor do player
        let move = { x: 0, z: 0 };
        let selectedMaterialType = 0;

        const materials = [
            new THREE.MeshLambertMaterial({ color: 0x559933 }), // Grama
            new THREE.MeshLambertMaterial({ color: 0x8b5a2b }), // Terra
            new THREE.MeshLambertMaterial({ color: 0x7f7f7f })  // Pedra
        ];

        function startGame() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-hud').style.display = 'flex';
            document.getElementById('selector-hud').style.display = 'flex';
            gameStarted = true;
            init3D();
        }

        function selectBlockType(type) {
            selectedMaterialType = type;
            document.querySelectorAll('.block-opt').forEach((el, idx) => {
                if (idx === type) el.classList.add('selected');
                else el.classList.remove('selected');
            });
        }

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#7ec0ee');
            scene.fog = new THREE.FogExp2('#7ec0ee', 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Luzes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(40, 100, 40);
            scene.add(dirLight);

            // Criar o Personagem (Boneco estilo Steve simples)
            const playerGeo = new THREE.BoxGeometry(1.2, 2.4, 0.8);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0x3366cc });
            playerMesh = new THREE.Mesh(playerGeo, playerMat);
            scene.add(playerMesh);

            // Gerar mundo de blocos
            for (let x = -12; x <= 12; x += 2) {
                for (let z = -12; z <= 12; z += 2) {
                    createBlockAt(x, -2, z, materials[0]);
                    createBlockAt(x, -4, z, materials[1]);
                }
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setupMobileControls();
            animate();
        }

        function createBlockAt(x, y, z, material) {
            const boxGeo = new THREE.BoxGeometry(2, 2, 2);
            const mesh = new THREE.Mesh(boxGeo, material);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push(mesh);
            return mesh;
        }

        function setupMobileControls() {
            // Joystick Esquerdo (Movimento corrigido)
            const joystick = document.getElementById('joystick');
            const knob = document.getElementById('joystick-knob');
            let jId = null, startX = 0, startY = 0;

            joystick.addEventListener('touchstart', (e) => {
                const t = e.changedTouches[0];
                jId = t.identifier;
                startX = t.clientX;
                startY = t.clientY;
                e.preventDefault();
            }, { passive: false });

            joystick.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === jId) {
                        let dx = t.clientX - startX;
                        let dy = t.clientY - startY;
                        let dist = Math.hypot(dx, dy);
                        let maxDist = 35;

                        if (dist > maxDist) {
                            dx = (dx / dist) * maxDist;
                            dy = (dy / dist) * maxDist;
                        }

                        knob.style.transform = `translate(${dx}px, ${dy}px)`;
                        move.x = dx / maxDist;
                        move.z = dy / maxDist; // Ajustado para frente/trás correto
                    }
                }
                e.preventDefault();
            }, { passive: false });

            joystick.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === jId) {
                        jId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        move.x = 0;
                        move.z = 0;
                    }
                }
                e.preventDefault();
            }, { passive: false });

            // Toque na direita para girar a câmera ao redor do personagem
            let lookId = null, lastLookX = 0, lastLookY = 0;

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.clientX > window.innerWidth / 2 && lookId === null && !e.target.closest('#selector-hud') && !e.target.closest('.action-btn')) {
                        lookId = t.identifier;
                        lastLookX = t.clientX;
                        lastLookY = t.clientY;
                    }
                }
            });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === lookId) {
                        let dx = t.clientX - lastLookX;
                        let dy = t.clientY - lastLookY;

                        cameraAngleY -= dx * 0.005;
                        cameraAngleX += dy * 0.005;
                        cameraAngleX = Math.max(0.1, Math.min(1.4, cameraAngleX));

                        lastLookX = t.clientX;
                        lastLookY = t.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === lookId) lookId = null;
                }
            });
        }

        function jumpPlayer() {
            if (player.isGrounded) {
                player.vy = 0.25;
                player.isGrounded = false;
            }
        }

        // Colisão AABB simples com os blocos do mundo
        function checkCollision(nx, ny, nz) {
            const pBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(nx, ny, nz), new THREE.Vector3(1.0, 2.2, 0.6));
            for (let block of blocks) {
                const bBox = new THREE.Box3().setFromObject(block);
                if (pBox.intersectsBox(bBox)) return true;
            }
            return false;
        }

        function breakBlock() {
            // Remove o bloco mais próximo à frente do player
            if (blocks.length > 0) {
                let targetIdx = 0;
                let minDist = 999;
                blocks.forEach((b, idx) => {
                    let d = b.position.distanceTo(playerMesh.position);
                    if (d < minDist && d < 6) {
                        minDist = d;
                        targetIdx = idx;
                    }
                });
                if (minDist < 6) {
                    scene.remove(blocks[targetIdx]);
                    blocks.splice(targetIdx, 1);
                }
            }
        }

        function placeBlock() {
            const pos = playerMesh.position.clone().add(new THREE.Vector3(0, -1, 0).applyAxisAngle(new THREE.Vector3(0,1,0), player.rotY));
            const snapX = Math.round(pos.x / 2) * 2;
            const snapY = Math.round(pos.y / 2) * 2;
            const snapZ = Math.round(pos.z / 2) * 2;
            createBlockAt(snapX, snapY + 2, snapZ, materials[selectedMaterialType]);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                // 1. Movimento relativo à direção para onde a câmera aponta
                if (move.x !== 0 || move.z !== 0) {
                    let moveAngle = Math.atan2(move.x, move.z) + cameraAngleY;
                    player.rotY = moveAngle;

                    let dx = Math.sin(moveAngle) * player.speed * 12;
                    let dz = Math.cos(moveAngle) * player.speed * 12;

                    // Teste de colisão horizontal eixo X e Z
                    if (!checkCollision(player.x + dx, player.y, player.z)) player.x += dx;
                    if (!checkCollision(player.x, player.y, player.z + dz)) player.z += dz;
                }

                // 2. Física e Gravidade
                player.vy -= 0.015; // Gravidade
                player.y += player.vy;

                // Colisão vertical (chão/teto)
                if (checkCollision(player.x, player.y, player.z)) {
                    player.y -= player.vy;
                    if (player.vy < 0) player.isGrounded = true;
                    player.vy = 0;
                } else {
                    player.isGrounded = false;
                }

                // Atualizar posição do mesh do player
                playerMesh.position.set(player.x, player.y, player.z);
                playerMesh.rotation.y = player.rotY;

                // 3. Câmera em Terceira Pessoa Orbitando o Player
                let distCam = 7;
                let cx = player.x - Math.sin(cameraAngleY) * Math.cos(cameraAngleX) * distCam;
                let cy = player.y + Math.sin(cameraAngleX) * distCam + 1;
                let cz = player.z - Math.cos(cameraAngleY) * Math.cos(cameraAngleX) * distCam;

                camera.position.set(cx, cy, cz);
                camera.lookAt(player.x, player.y + 0.5, player.z);

                document.getElementById('pos-val').innerText = `${Math.round(player.x)}, ${Math.round(player.y)}, ${Math.round(player.z)}`;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
